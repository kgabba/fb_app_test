version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: proj18-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db:/docker-entrypoint-initdb.d

  app:
    build: .
    container_name: proj18-app
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data:
